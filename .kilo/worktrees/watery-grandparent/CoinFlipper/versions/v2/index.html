  <script>
    // Mobile Safari/Chrome audio unlock: resume AudioContext on first gesture.
    (function () {
      let unlocked = false;
      let unlockPromise = null;

      function getContext() {
        if (!window.__coinflipperUnlockCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          window.__coinflipperUnlockCtx = new AC();
        }
        return window.__coinflipperUnlockCtx;
      }

      async function unlockAudio() {
        if (unlocked) return;
        if (unlockPromise) return unlockPromise;

        unlockPromise = (async () => {
          try {
            const ctx = getContext();
            if (!ctx) return;
            if (ctx.state === "suspended") await ctx.resume();

            // Tiny silent buffer nudges Safari into unlocked state.
            const buffer = ctx.createBuffer(1, 1, ctx.sampleRate);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            source.start(0);
            unlocked = true;
          } catch {}
        })();

        await unlockPromise;
      }

      const onFirstGesture = () => {
        unlockAudio();
        window.removeEventListener("pointerdown", onFirstGesture);
        window.removeEventListener("touchstart", onFirstGesture);
      };

      window.addEventListener("pointerdown", onFirstGesture, { passive: true });
      window.addEventListener("touchstart", onFirstGesture, { passive: true });
      window.addEventListener("pageshow", unlockAudio);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") unlockAudio();
      });
    })();
