<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                <path d="M16 16h5v5"></path>
            </svg>
            <h2>Auto Refresh Timer v2.0</h2>
        </div>

        <div class="input-group">
            <label for="minutes">Refresh interval (minutes)</label>
            <input type="number" id="minutes" min="1" value="1">
        </div>
        
        <div class="button-group">
            <button id="startBtn" class="btn-primary">Start</button>
            <button id="stopBtn" class="btn-secondary">Stop</button>
        </div>
        
        <button id="resetBtn" class="btn-tertiary">Reset</button>

        <div class="status-container">
            <div id="statusIndicator" class="status-dot"></div>
            <div id="status" class="status-text">Inactive</div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
