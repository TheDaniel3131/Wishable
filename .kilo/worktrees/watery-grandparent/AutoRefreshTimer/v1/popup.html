<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">
        <h2>Auto Refresh</h2>
        <div class="input-group">
            <label for="minutes">Refresh interval (minutes):</label>
            <input type="number" id="minutes" min="1" value="1">
        </div>
        <div class="button-group">
            <button id="startBtn" class="btn-primary">Start</button>
            <button id="stopBtn" class="btn-secondary">Stop</button>
        </div>
        <div id="status" class="status-text">Inactive</div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
