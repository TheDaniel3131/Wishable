version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: moneytracker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       moneytracker
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (optional DB GUI) ───────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: moneytracker_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@moneytracker.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles: ["tools"]    # only starts with: docker compose --profile tools up

  # ── Node.js API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moneytracker_api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     moneytracker
      DB_USER:     postgres
      DB_PASSWORD: postgres
      NODE_ENV:    development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src   # hot-reload in dev
      - api_uploads:/app/uploads

volumes:
  postgres_data:
  api_uploads:
