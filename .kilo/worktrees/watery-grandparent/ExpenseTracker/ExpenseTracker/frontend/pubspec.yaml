name: moneytracker
description: Cross-platform money tracker with receipt scanning
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.1
  pretty_dio_logger: ^1.3.1

  # Local storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Camera & scanning
  mobile_scanner: ^4.0.1
  image_picker: ^1.0.7
  camera: ^0.10.5+9

  # Charts
  fl_chart: ^0.67.0

  # UI & design
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  gap: ^3.0.1
  iconsax: ^0.0.8

  # Utils
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  uuid: ^4.3.3
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  file_picker: ^8.0.3
  http_parser: ^4.0.2
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Clash Display
      fonts:
        - asset: assets/fonts/ClashDisplay-Regular.ttf
        - asset: assets/fonts/ClashDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/ClashDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ClashDisplay-Bold.ttf
          weight: 700
