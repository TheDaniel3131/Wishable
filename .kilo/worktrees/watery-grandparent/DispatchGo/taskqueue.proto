syntax = "proto3";

package taskqueue;

option go_package = "github.com/grpc-taskqueue/proto";

// ─── Messages ───────────────────────────────────────────────────────────────

message Task {
  string id         = 1;
  string type       = 2;   // e.g. "email", "resize_image", "transcode"
  string payload    = 3;   // JSON-encoded input
  int32  priority   = 4;   // 1 (low) – 10 (critical)
  int64  created_at = 5;   // Unix millis
}

message TaskResult {
  string task_id    = 1;
  string worker_id  = 2;
  bool   success    = 3;
  string output     = 4;
  string error      = 5;
  int64  duration_ms = 6;
}

message WorkerInfo {
  string worker_id   = 1;
  string hostname    = 2;
  repeated string supported_types = 3;
  int32  concurrency = 4;
}

message TaskProgress {
  string task_id    = 1;
  string worker_id  = 2;
  int32  percent    = 3;   // 0–100
  string message    = 4;
}

message SubmitRequest  { Task task = 1; }
message SubmitResponse { string task_id = 1; bool accepted = 2; }

message PullRequest    { WorkerInfo worker = 1; }

message AckRequest     { TaskResult result = 1; }
message AckResponse    { bool ok = 1; }

message WatchRequest   {}  // subscribe to live events

message QueueEvent {
  enum Type {
    TASK_SUBMITTED  = 0;
    TASK_ASSIGNED   = 1;
    TASK_PROGRESS   = 2;
    TASK_COMPLETED  = 3;
    TASK_FAILED     = 4;
    WORKER_JOINED   = 5;
    WORKER_LEFT     = 6;
  }
  Type          type       = 1;
  string        task_id    = 2;
  string        worker_id  = 3;
  TaskProgress  progress   = 4;
  TaskResult    result     = 5;
  WorkerInfo    worker     = 6;
  int64         timestamp  = 7;
}

message StatsRequest {}
message QueueStats {
  int32 pending   = 1;
  int32 running   = 2;
  int32 completed = 3;
  int32 failed    = 4;
  int32 workers   = 5;
  double throughput_per_min = 6;
}

// ─── Service ─────────────────────────────────────────────────────────────────

service TaskQueue {
  // Client → Server: submit a new task
  rpc SubmitTask(SubmitRequest) returns (SubmitResponse);

  // Worker → Server: bidirectional stream — worker pulls tasks, sends results
  rpc WorkerStream(stream AckRequest) returns (stream Task);

  // Worker → Server: report incremental progress
  rpc ReportProgress(TaskProgress) returns (AckResponse);

  // Dashboard → Server: server-side stream of live queue events
  rpc WatchEvents(WatchRequest) returns (stream QueueEvent);

  // Dashboard → Server: snapshot stats
  rpc GetStats(StatsRequest) returns (QueueStats);
}
